name: Build v8unpack

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: 🧩 Checkout source
        uses: actions/checkout@v4

      - name: ⚙️ Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake libboost-all-dev

      - name: ⚙️ Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $BoostDir = "C:\local\boost_1_88_0"
          if (!(Test-Path $BoostDir)) {
            Invoke-WebRequest -Uri "https://archives.boost.io/release/1.88.0/source/boost_1_88_0.zip" -OutFile "boost.zip"
            Expand-Archive boost.zip -DestinationPath "C:\local"
          }

      - name: 🧱 Configure project
        run: |
          cmake -B build -S .
        shell: bash

      - name: 🧰 Build project
        run: |
          cmake --build build --config Release
        shell: bash

      - name: ✅ Verify executable
        run: |
          ls build
        shell: bash
